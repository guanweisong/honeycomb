name: Set up Honeycomb
description: Install the locked Bun dependencies and optionally restore the build cache
inputs:
  cache-next:
    description: Restore the Turbopack build cache
    default: "false"
runs:
  using: composite
  steps:
    - id: bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: ${{ inputs.cache-next == 'true' }}
      with:
        path: .next/cache/turbopack
        key: next-${{ runner.os }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', '*config*', 'scripts/build-serwist.ts', '.github/workflows/quality*.yml') }}
        restore-keys: |
          next-${{ runner.os }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}-
    - run: bun install --frozen-lockfile
      shell: bash
