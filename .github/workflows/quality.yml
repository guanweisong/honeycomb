name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun add --global @fission-ai/openspec@1.4.1
      - run: bun run quality:spec
        env:
          QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  unit_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Verify with an exclusive disposable database
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          cleanup() {
            status=$?
            trap - EXIT HUP INT TERM
            if [ -d "$HONEYCOMB_TEST_DIR" ] && [ ! -L "$HONEYCOMB_TEST_DIR" ] && [ "$(stat -c %u "$HONEYCOMB_TEST_DIR")" = "$(id -u)" ]; then
              rm -rf -- "$HONEYCOMB_TEST_DIR"
              test ! -e "$HONEYCOMB_TEST_DIR" || status=1
            else
              echo "Test directory cleanup could not verify ownership" >&2
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          bun scripts/e2e-seed-policy.ts --initialize
          bun run check-types
          bun run lint
          bun run db:migrations:check
          bun scripts/e2e-seed-policy.ts
          bun run db:invariants:audit
          bun run db:migrate
          bun run db:e2e:seed
          bun run test:unit:coverage
          bun run test:unit:process
          bun run audit:production --output dependency-audit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-dependency-audit
          path: dependency-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
  build_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Build and test with an exclusive disposable database
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          cleanup() {
            status=$?
            trap - EXIT HUP INT TERM
            if [ -d "$HONEYCOMB_TEST_DIR" ] && [ ! -L "$HONEYCOMB_TEST_DIR" ] && [ "$(stat -c %u "$HONEYCOMB_TEST_DIR")" = "$(id -u)" ]; then
              rm -rf -- "$HONEYCOMB_TEST_DIR"
              test ! -e "$HONEYCOMB_TEST_DIR" || status=1
            else
              echo "Test directory cleanup could not verify ownership" >&2
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          bun scripts/e2e-seed-policy.ts --initialize
          bun scripts/e2e-seed-policy.ts
          bun run db:invariants:audit
          bun run db:migrate
          bun run db:e2e:seed
          bun run build
          timeout 10m bun run analyze
          PLAYWRIGHT_USE_DEV_SERVER=1 PLAYWRIGHT_PORT=3100 bun run test:e2e:development
          PLAYWRIGHT_USE_DEV_SERVER=0 PLAYWRIGHT_PORT=3101 bun run test:e2e:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: .next/diagnostics/analyze/
          if-no-files-found: ignore
          retention-days: 14
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [specs, unit_checks, build_e2e]
    if: ${{ always() }}
    steps:
      - name: Require every quality lane to succeed
        env:
          SPECS_RESULT: ${{ needs.specs.result }}
          UNIT_CHECKS_RESULT: ${{ needs.unit_checks.result }}
          BUILD_E2E_RESULT: ${{ needs.build_e2e.result }}
        run: |
          test "$SPECS_RESULT" = success
          test "$UNIT_CHECKS_RESULT" = success
          test "$BUILD_E2E_RESULT" = success
