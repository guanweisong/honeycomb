name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run lint
      - run: bun run test:unit:coverage
      - run: bun audit --audit-level=critical
      - run: >-
          NEXT_PUBLIC_SITE_URL=https://example.test
          TURSO_URL=http://127.0.0.1:1
          TURSO_TOKEN=unreachable-test-token
          AUTH_SECRET=uW7fB4qZ9kLm2Rx5Nv8Cd1Yp6Hs3Ta0E
          AUTH_URL=https://example.test
          bun run build
      - run: bunx playwright install --with-deps chromium
      - run: >-
          bunx playwright test
          tests/e2e/security-headers.spec.ts
          tests/e2e/admin/rbac.spec.ts
          tests/e2e/blog/pwa-offline.spec.ts
          --project=chromium
