name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun add --global @fission-ai/openspec@1.4.1
      - run: bun run quality:spec
        env:
          QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  unit_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      TURSO_URL: file:/tmp/honeycomb-ci.db
      TURSO_TOKEN: local
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run lint
      - run: bun run db:migrations:check
      - run: bun run db:invariants:audit
      - run: bunx drizzle-kit migrate
      - run: bun run db:e2e:seed
      - run: bun run test:unit:process
      - run: bun run audit:production
      - run: bunx vitest list --json=unit-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: unit-inventory
          path: unit-inventory.json
          if-no-files-found: error
          retention-days: 14
  unit_shards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      TURSO_URL: file:/tmp/honeycomb-ci.db
      TURSO_TOKEN: local
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx drizzle-kit migrate
      - run: bun run db:e2e:seed
      - run: bun run test:unit:shard --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        with:
          name: unit-shard-${{ matrix.shard }}
          path: unit-shard/
          if-no-files-found: error
          retention-days: 14
  unit_coverage:
    needs: [unit_checks, unit_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      TURSO_URL: file:/tmp/honeycomb-ci.db
      TURSO_TOKEN: local
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-shard-*
          path: unit-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: unit-inventory
          path: .
      - run: bun scripts/check-unit-shards.ts unit-artifacts unit-inventory.json unit-blobs
      - run: bun run test:unit:merge
      - run: bun scripts/check-unit-shards.ts --merged coverage/merged-results.json unit-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
  build_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      TURSO_URL: file:/tmp/honeycomb-ci.db
      TURSO_TOKEN: local
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx drizzle-kit migrate
      - run: bun run db:e2e:seed
      - run: bun run build
      - run: timeout 10m bun run analyze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: .next/diagnostics/analyze/
          if-no-files-found: ignore
          retention-days: 14
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e:development
        env:
          PLAYWRIGHT_USE_DEV_SERVER: "1"
          PLAYWRIGHT_PORT: "3100"
          PLAYWRIGHT_OUTPUT_DIR: /tmp/honeycomb-e2e-development-results
          PLAYWRIGHT_HTML_REPORT: /tmp/honeycomb-e2e-development-report
      - run: bun run test:e2e:production
        env:
          PLAYWRIGHT_USE_DEV_SERVER: "0"
          PLAYWRIGHT_PORT: "3101"
          PLAYWRIGHT_OUTPUT_DIR: /tmp/honeycomb-e2e-production-results
          PLAYWRIGHT_HTML_REPORT: /tmp/honeycomb-e2e-production-report
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [specs, unit_checks, unit_shards, unit_coverage, build_e2e]
    if: ${{ always() }}
    steps:
      - name: Require every quality lane to succeed
        env:
          SPECS_RESULT: ${{ needs.specs.result }}
          UNIT_CHECKS_RESULT: ${{ needs.unit_checks.result }}
          BUILD_E2E_RESULT: ${{ needs.build_e2e.result }}
          UNIT_SHARDS_RESULT: ${{ needs.unit_shards.result }}
          UNIT_COVERAGE_RESULT: ${{ needs.unit_coverage.result }}
        run: |
          test "$SPECS_RESULT" = success
          test "$UNIT_CHECKS_RESULT" = success
          test "$BUILD_E2E_RESULT" = success
          test "$UNIT_SHARDS_RESULT" = success
          test "$UNIT_COVERAGE_RESULT" = success
