name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun add --global @fission-ai/openspec@1.4.1
      - run: bun run quality:spec
        env:
          QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  unit_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Run static and serial process checks with isolated fixture
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          cleanup() {
            status=$?
            cleanup_start=$(node -p 'Date.now()')
            trap - EXIT HUP INT TERM
            if [ -d "$HONEYCOMB_TEST_DIR" ] && [ ! -L "$HONEYCOMB_TEST_DIR" ] && [ "$(stat -c %u "$HONEYCOMB_TEST_DIR")" = "$(id -u)" ]; then
              rm -rf -- "$HONEYCOMB_TEST_DIR"
              test ! -e "$HONEYCOMB_TEST_DIR" || status=1
            else
              echo "Test directory cleanup could not verify ownership" >&2
              status=1
            fi
            cleanup_elapsed=$(( $(node -p 'Date.now()') - cleanup_start ))
            printf 'Fixture cleanup: %s ms (final exit=%s)\n' "$cleanup_elapsed" "$status"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf -- '- Fixture cleanup: %s ms (final exit=%s)\n' "$cleanup_elapsed" "$status" >> "$GITHUB_STEP_SUMMARY" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          phase() {
            local label="$1"; shift
            local start elapsed code
            start=$(node -p 'Date.now()')
            echo "::group::$label"
            if "$@"; then code=0; else code=$?; fi
            elapsed=$(( $(node -p 'Date.now()') - start ))
            printf '%s: %s ms (exit=%s)\n' "$label" "$elapsed" "$code"
            echo "::endgroup::"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf -- '- %s: %s ms (exit=%s)\n' "$label" "$elapsed" "$code" >> "$GITHUB_STEP_SUMMARY"
            fi
            return "$code"
          }
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          phase "Initialize isolated fixture" bun scripts/e2e-seed-policy.ts --initialize
          phase "Typecheck" bun run check-types
          phase "Lint" bun run lint
          phase "Check migration governance" bun run db:migrations:check
          phase "Check fixture safety" bun scripts/e2e-seed-policy.ts
          phase "Audit database invariants" bun run db:invariants:audit
          phase "Migrate isolated database" bun run db:migrate
          phase "Seed isolated database" bun run db:e2e:seed
          phase "Serial process tests" bun run test:unit:process
          phase "Audit production dependencies" bun run audit:production --output dependency-audit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-dependency-audit
          path: dependency-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
  unit_coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Run coverage shard with isolated fixture
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          cleanup() {
            status=$?
            cleanup_start=$(node -p 'Date.now()')
            trap - EXIT HUP INT TERM
            if [ -d "$HONEYCOMB_TEST_DIR" ] && [ ! -L "$HONEYCOMB_TEST_DIR" ] && [ "$(stat -c %u "$HONEYCOMB_TEST_DIR")" = "$(id -u)" ]; then
              rm -rf -- "$HONEYCOMB_TEST_DIR"
              test ! -e "$HONEYCOMB_TEST_DIR" || status=1
            else
              echo "Test directory cleanup could not verify ownership" >&2
              status=1
            fi
            cleanup_elapsed=$(( $(node -p 'Date.now()') - cleanup_start ))
            printf 'Fixture cleanup: %s ms (final exit=%s)\n' "$cleanup_elapsed" "$status"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf -- '- Fixture cleanup: %s ms (final exit=%s)\n' "$cleanup_elapsed" "$status" >> "$GITHUB_STEP_SUMMARY" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          phase() {
            local label="$1"; shift
            local start elapsed code
            start=$(node -p 'Date.now()')
            echo "::group::$label"
            if "$@"; then code=0; else code=$?; fi
            elapsed=$(( $(node -p 'Date.now()') - start ))
            printf '%s: %s ms (exit=%s)\n' "$label" "$elapsed" "$code"
            echo "::endgroup::"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf -- '- %s: %s ms (exit=%s)\n' "$label" "$elapsed" "$code" >> "$GITHUB_STEP_SUMMARY"
            fi
            return "$code"
          }
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          phase "Initialize isolated fixture" bun scripts/e2e-seed-policy.ts --initialize
          phase "Check fixture safety" bun scripts/e2e-seed-policy.ts
          phase "Audit database invariants" bun run db:invariants:audit
          phase "Migrate isolated database" bun run db:migrate
          phase "Seed isolated database" bun run db:e2e:seed
          phase "Coverage shard ${{ matrix.shard }}/2" bun run test:unit:coverage --shard=${{ matrix.shard }}/2 --reporter=default --reporter=blob --reporter=github-actions --config=vitest.shard.config.mts
      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-shard-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  coverage_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit_coverage]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-coverage-shard-*
          path: .vitest/blob/
          merge-multiple: true
      - name: Require both shards and enforce the original coverage thresholds
        shell: bash
        run: |
          test -s .vitest/blob/blob-1-2.json
          test -s .vitest/blob/blob-2-2.json
          test "$(find .vitest/blob -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          bun run test:unit:coverage --merge-reports=.vitest/blob
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
  build_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .next/cache/turbopack
          key: next-${{ runner.os }}-node24-bun1.4.4-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', '*config*', 'scripts/build-serwist.ts', '.github/workflows/quality.yml') }}
          restore-keys: |
            next-${{ runner.os }}-node24-bun1.4.4-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Build, analyze and production E2E with isolated fixture
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          cleanup() {
            status=$?
            cleanup_start=$(node -p 'Date.now()')
            trap - EXIT HUP INT TERM
            if [ -d "$HONEYCOMB_TEST_DIR" ] && [ ! -L "$HONEYCOMB_TEST_DIR" ] && [ "$(stat -c %u "$HONEYCOMB_TEST_DIR")" = "$(id -u)" ]; then
              rm -rf -- "$HONEYCOMB_TEST_DIR"
              test ! -e "$HONEYCOMB_TEST_DIR" || status=1
            else
              echo "Test directory cleanup could not verify ownership" >&2
              status=1
            fi
            cleanup_elapsed=$(( $(node -p 'Date.now()') - cleanup_start ))
            printf 'Fixture cleanup: %s ms (final exit=%s)\n' "$cleanup_elapsed" "$status"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf -- '- Fixture cleanup: %s ms (final exit=%s)\n' "$cleanup_elapsed" "$status" >> "$GITHUB_STEP_SUMMARY" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          phase() {
            local label="$1"; shift
            local start elapsed code
            start=$(node -p 'Date.now()')
            echo "::group::$label"
            if "$@"; then code=0; else code=$?; fi
            elapsed=$(( $(node -p 'Date.now()') - start ))
            printf '%s: %s ms (exit=%s)\n' "$label" "$elapsed" "$code"
            echo "::endgroup::"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf -- '- %s: %s ms (exit=%s)\n' "$label" "$elapsed" "$code" >> "$GITHUB_STEP_SUMMARY"
            fi
            return "$code"
          }
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          phase "Initialize isolated fixture" bun scripts/e2e-seed-policy.ts --initialize
          phase "Check fixture safety" bun scripts/e2e-seed-policy.ts
          phase "Audit database invariants" bun run db:invariants:audit
          phase "Migrate isolated database" bun run db:migrate
          phase "Seed isolated database" bun run db:e2e:seed
          phase "Production build" bun run build
          phase "Bundle analysis" timeout 10m bun run analyze
          phase "Production E2E" env PLAYWRIGHT_USE_DEV_SERVER=0 PLAYWRIGHT_PORT=3101 bun run test:e2e:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: .next/diagnostics/analyze/
          if-no-files-found: ignore
          retention-days: 14
  development_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run development E2E with isolated fixture
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          cleanup() {
            status=$?
            cleanup_start=$(node -p 'Date.now()')
            trap - EXIT HUP INT TERM
            if [ -d "$HONEYCOMB_TEST_DIR" ] && [ ! -L "$HONEYCOMB_TEST_DIR" ] && [ "$(stat -c %u "$HONEYCOMB_TEST_DIR")" = "$(id -u)" ]; then
              rm -rf -- "$HONEYCOMB_TEST_DIR"
              test ! -e "$HONEYCOMB_TEST_DIR" || status=1
            else
              echo "Test directory cleanup could not verify ownership" >&2
              status=1
            fi
            cleanup_elapsed=$(( $(node -p 'Date.now()') - cleanup_start ))
            printf 'Fixture cleanup: %s ms (final exit=%s)\n' "$cleanup_elapsed" "$status"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf -- '- Fixture cleanup: %s ms (final exit=%s)\n' "$cleanup_elapsed" "$status" >> "$GITHUB_STEP_SUMMARY" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          phase() {
            local label="$1"; shift
            local start elapsed code
            start=$(node -p 'Date.now()')
            echo "::group::$label"
            if "$@"; then code=0; else code=$?; fi
            elapsed=$(( $(node -p 'Date.now()') - start ))
            printf '%s: %s ms (exit=%s)\n' "$label" "$elapsed" "$code"
            echo "::endgroup::"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf -- '- %s: %s ms (exit=%s)\n' "$label" "$elapsed" "$code" >> "$GITHUB_STEP_SUMMARY"
            fi
            return "$code"
          }
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          phase "Initialize isolated fixture" bun scripts/e2e-seed-policy.ts --initialize
          phase "Check fixture safety" bun scripts/e2e-seed-policy.ts
          phase "Audit database invariants" bun run db:invariants:audit
          phase "Migrate isolated database" bun run db:migrate
          phase "Seed isolated database" bun run db:e2e:seed
          phase "Development E2E" env PLAYWRIGHT_USE_DEV_SERVER=1 PLAYWRIGHT_PORT=3100 bun run test:e2e:development
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        specs,
        unit_checks,
        unit_coverage,
        coverage_gate,
        build_e2e,
        development_e2e,
      ]
    if: ${{ always() }}
    steps:
      - name: Require every quality lane to succeed
        env:
          SPECS_RESULT: ${{ needs.specs.result }}
          UNIT_CHECKS_RESULT: ${{ needs.unit_checks.result }}
          UNIT_COVERAGE_RESULT: ${{ needs.unit_coverage.result }}
          COVERAGE_GATE_RESULT: ${{ needs.coverage_gate.result }}
          DEVELOPMENT_E2E_RESULT: ${{ needs.development_e2e.result }}
          BUILD_E2E_RESULT: ${{ needs.build_e2e.result }}
        run: |
          test "$SPECS_RESULT" = success
          test "$UNIT_CHECKS_RESULT" = success
          test "$BUILD_E2E_RESULT" = success
          test "$UNIT_COVERAGE_RESULT" = success
          test "$COVERAGE_GATE_RESULT" = success
          test "$DEVELOPMENT_E2E_RESULT" = success
