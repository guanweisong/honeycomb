name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://example.test
      TURSO_URL: file:/tmp/honeycomb-ci.db
      TURSO_TOKEN: local
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run lint
      - run: bun run db:migrations:check
      - run: bunx drizzle-kit migrate
      - run: bun run db:e2e:seed
      - run: bun run test:unit:run
      - run: bun run test:unit:coverage
      - run: bun run test:unit:process
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - run: bun run audit:production
      - run: bun run build
      - run: timeout 10m bun run analyze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: .next/diagnostics/analyze/
          if-no-files-found: ignore
          retention-days: 14
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --project=chromium
