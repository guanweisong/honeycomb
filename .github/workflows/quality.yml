name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      high_risk: ${{ steps.classify.outputs.high_risk }}
      has_test_targets: ${{ steps.classify.outputs.has_test_targets }}
      requires_production_e2e: ${{ steps.classify.outputs.requires_production_e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        shell: bash
        env:
          QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/classify-quality-changes.sh "$QUALITY_DIFF_BASE_SHA" "$GITHUB_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun add --global @fission-ai/openspec@1.4.1
      - run: bun run quality:spec
        env:
          QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  unit_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Run static and serial process checks with isolated fixture
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          source scripts/ci-fixture-lifecycle.sh
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          phase "Initialize isolated fixture" bun scripts/e2e-seed-policy.ts --initialize
          phase "Typecheck" bun run check-types
          phase "Lint" bun run lint
          phase "Check migration governance" bun run db:migrations:check
          phase "Check fixture safety" bun scripts/e2e-seed-policy.ts
          phase "Audit database invariants" bun run db:invariants:audit
          phase "Migrate isolated database" bun run db:migrate
          phase "Seed isolated database" bun run db:e2e:seed
          phase "Serial process tests" bun run test:unit:process
          phase "Audit production dependencies" bun run audit:production --output dependency-audit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-dependency-audit
          path: dependency-audit-report.json
          if-no-files-found: ignore
          retention-days: 14

  feature_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [specs]
    if: ${{ needs.specs.outputs.has_test_targets == 'true' && needs.specs.outputs.high_risk != 'true' }}
    env:
      QUALITY_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Run related feature tests with an isolated fixture
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          source scripts/ci-fixture-lifecycle.sh
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          phase "Initialize isolated fixture" bun scripts/e2e-seed-policy.ts --initialize
          phase "Check fixture safety" bun scripts/e2e-seed-policy.ts
          phase "Audit database invariants" bun run db:invariants:audit
          phase "Migrate isolated database" bun run db:migrate
          phase "Seed isolated database" bun run db:e2e:seed
          if [[ "$QUALITY_DIFF_BASE_SHA" =~ ^0+$ ]]; then
            phase "Full feature tests for initial commit" bun run test:unit:run || exit $?
          else
            phase "Related feature tests" bun run test:unit:run --changed="$QUALITY_DIFF_BASE_SHA" || exit $?
          fi

  high_risk_unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [specs]
    if: ${{ needs.specs.outputs.high_risk == 'true' }}
    env:
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Run the full unit and integration inventory with an isolated fixture
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          source scripts/ci-fixture-lifecycle.sh
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          phase "Initialize isolated fixture" bun scripts/e2e-seed-policy.ts --initialize
          phase "Check fixture safety" bun scripts/e2e-seed-policy.ts
          phase "Audit database invariants" bun run db:invariants:audit
          phase "Migrate isolated database" bun run db:migrate
          phase "Seed isolated database" bun run db:e2e:seed
          phase "Full unit and integration tests" bun run test:unit:run

  high_risk_development_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [specs]
    if: ${{ needs.specs.outputs.high_risk == 'true' }}
    env:
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run development E2E with an isolated fixture
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          source scripts/ci-fixture-lifecycle.sh
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          phase "Initialize isolated fixture" bun scripts/e2e-seed-policy.ts --initialize
          phase "Check fixture safety" bun scripts/e2e-seed-policy.ts
          phase "Audit database invariants" bun run db:invariants:audit
          phase "Migrate isolated database" bun run db:migrate
          phase "Seed isolated database" bun run db:e2e:seed
          phase "Development E2E" env PLAYWRIGHT_USE_DEV_SERVER=1 PLAYWRIGHT_PORT=3100 bun run test:e2e:development

  high_risk_production_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [specs]
    if: ${{ needs.specs.outputs.high_risk == 'true' && needs.specs.outputs.requires_production_e2e == 'true' }}
    env:
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .next/cache/turbopack
          key: next-${{ runner.os }}-node24-bun1.4.4-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', '*config*', 'scripts/build-serwist.ts', '.github/workflows/quality.yml') }}
          restore-keys: |
            next-${{ runner.os }}-node24-bun1.4.4-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run production E2E with an isolated fixture
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          source scripts/ci-fixture-lifecycle.sh
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          phase "Initialize isolated fixture" bun scripts/e2e-seed-policy.ts --initialize
          phase "Check fixture safety" bun scripts/e2e-seed-policy.ts
          phase "Audit database invariants" bun run db:invariants:audit
          phase "Migrate isolated database" bun run db:migrate
          phase "Seed isolated database" bun run db:e2e:seed
          phase "Production E2E" env PLAYWRIGHT_USE_DEV_SERVER=0 PLAYWRIGHT_PORT=3101 bun run test:e2e:production

  production_build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://example.test
      AUTH_SECRET: ci-build-only-test-secret-32-characters-long
      AUTH_URL: https://example.test
      E2E_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: .next/cache/turbopack
          key: next-${{ runner.os }}-node24-bun1.4.4-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', '*config*', 'scripts/build-serwist.ts', '.github/workflows/quality.yml') }}
          restore-keys: |
            next-${{ runner.os }}-node24-bun1.4.4-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - name: Build production application with an isolated fixture
        shell: bash
        run: |
          export HONEYCOMB_TEST_DIR="$(mktemp -d "${TMPDIR:-/tmp}/honeycomb-test.XXXXXXXX")"
          source scripts/ci-fixture-lifecycle.sh
          export TURSO_URL="file:${HONEYCOMB_TEST_DIR}/test.db"
          export TURSO_TOKEN=e2e-local-only
          phase "Initialize isolated fixture" bun scripts/e2e-seed-policy.ts --initialize
          phase "Check fixture safety" bun scripts/e2e-seed-policy.ts
          phase "Audit database invariants" bun run db:invariants:audit
          phase "Migrate isolated database" bun run db:migrate
          phase "Seed isolated database" bun run db:e2e:seed
          phase "Production build" bun run build

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        specs,
        unit_checks,
        feature_tests,
        high_risk_unit_tests,
        high_risk_development_e2e,
        high_risk_production_e2e,
        production_build,
      ]
    if: ${{ always() }}
    steps:
      - name: Require every applicable quality lane to succeed
        env:
          SPECS_RESULT: ${{ needs.specs.result }}
          HAS_TEST_TARGETS: ${{ needs.specs.outputs.has_test_targets }}
          HIGH_RISK: ${{ needs.specs.outputs.high_risk }}
          REQUIRES_PRODUCTION_E2E: ${{ needs.specs.outputs.requires_production_e2e }}
          UNIT_CHECKS_RESULT: ${{ needs.unit_checks.result }}
          FEATURE_TESTS_RESULT: ${{ needs.feature_tests.result }}
          HIGH_RISK_UNIT_RESULT: ${{ needs.high_risk_unit_tests.result }}
          HIGH_RISK_E2E_RESULT: ${{ needs.high_risk_development_e2e.result }}
          HIGH_RISK_PRODUCTION_E2E_RESULT: ${{ needs.high_risk_production_e2e.result }}
          PRODUCTION_BUILD_RESULT: ${{ needs.production_build.result }}
        shell: bash
        run: |
          test "$SPECS_RESULT" = success
          test "$UNIT_CHECKS_RESULT" = success
          test "$PRODUCTION_BUILD_RESULT" = success
          if [[ "$HIGH_RISK" == true ]]; then
            test "$HIGH_RISK_UNIT_RESULT" = success
            test "$HIGH_RISK_E2E_RESULT" = success
            test "$FEATURE_TESTS_RESULT" = skipped
            if [[ "$REQUIRES_PRODUCTION_E2E" == true ]]; then
              test "$HIGH_RISK_PRODUCTION_E2E_RESULT" = success
            else
              test "$HIGH_RISK_PRODUCTION_E2E_RESULT" = skipped
            fi
          else
            test "$HIGH_RISK_UNIT_RESULT" = skipped
            test "$HIGH_RISK_E2E_RESULT" = skipped
            test "$HIGH_RISK_PRODUCTION_E2E_RESULT" = skipped
            if [[ "$HAS_TEST_TARGETS" == true ]]; then
              test "$FEATURE_TESTS_RESULT" = success
            else
              test "$FEATURE_TESTS_RESULT" = skipped
            fi
          fi
